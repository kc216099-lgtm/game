<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivals FPS Clone</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            z-index: 50;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 0, 0.8);
        }
        #crosshair::before { left: 9px; top: 0; width: 2px; height: 20px; }
        #crosshair::after { left: 0; top: 9px; width: 20px; height: 2px; }
        
        #hit-marker {
            position: absolute; top: 50%; left: 50%;
            width: 30px; height: 30px;
            transform: translate(-50%, -50%) rotate(45deg);
            pointer-events: none; display: none;
            z-index: 51;
        }
        .marker-line { position: absolute; background: #ff0000; }
        .v { width: 2px; height: 10px; left: 14px; }
        .h { width: 10px; height: 2px; top: 14px; }
        .t { top: 0; } .b { bottom: 0; } .l { left: 0; } .r { right: 0; }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; color: white; padding: 20px; display: none;
            z-index: 40;
        }

        .point-pop {
            position: absolute; color: #4ade80; font-weight: 900; font-size: 20px;
            pointer-events: none; animation: float-up 0.8s ease-out forwards;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 60;
        }

        @keyframes float-up {
            0 { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-70px); opacity: 0; }
        }

        #menu, #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
            overflow-y: auto;
        }

        #game-over { display: none; }

        .card-select {
            cursor: pointer; transition: all 0.2s ease; border: 4px solid #1f2937;
            flex-shrink: 0;
            pointer-events: auto;
        }
        .card-select:hover { transform: scale(1.05); border-color: #3b82f6; }
        .card-active { border-color: #3b82f6; background: #1e3a8a !important; }

        .btn-deploy {
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s;
        }
        .btn-deploy:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        .btn-primary {
            background: #3b82f6; color: white; padding: 16px 48px;
            border-radius: 8px; font-weight: bold; text-transform: uppercase;
            letter-spacing: 2px; transition: all 0.2s; cursor: pointer; border: none;
        }
        
        .weapon-grid {
            display: flex; gap: 1rem; overflow-x: auto; width: 100%; padding: 10px;
            scrollbar-width: thin; scrollbar-color: #3b82f6 #1f2937;
        }

        #scope-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 25vh solid black; border-left-width: 35vw; border-right-width: 35vw;
            box-sizing: border-box; display: none; pointer-events: none;
            z-index: 45;
        }
        #scope-overlay::after {
            content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.4);
        }
        #scope-overlay::before {
            content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: rgba(255,255,255,0.4);
        }
        .vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,1); border-radius: 50%;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="menu">
        <div class="w-full max-w-6xl px-8 py-12">
            <h1 class="text-7xl font-black text-white mb-2 italic tracking-tighter">RIVALS</h1>
            <p class="text-gray-400 mb-10 uppercase tracking-widest text-sm">Select Your Loadout & Deploy</p>
            
            <div class="flex flex-col lg:flex-row gap-8 items-stretch">
                <!-- Left Section: Weapon Selection -->
                <div class="flex-grow">
                    <div class="flex items-center justify-between mb-4 border-b border-white/10 pb-2">
                        <h2 class="text-xl font-black text-white uppercase italic">Armory</h2>
                        <span class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Select Weapon</span>
                    </div>
                    <div class="weapon-grid">
                        <div onclick="setWeapon('ak')" id="w-ak" class="card-select card-active bg-gray-900 p-6 rounded-2xl w-48 text-center">
                            <div class="text-3xl mb-2">🔫</div>
                            <h3 class="text-white font-bold">AK-47</h3>
                            <p class="text-[10px] text-gray-500 mt-2 uppercase">Assault Rifle</p>
                        </div>
                        <div onclick="setWeapon('sniper')" id="w-sniper" class="card-select bg-gray-900 p-6 rounded-2xl w-48 text-center">
                            <div class="text-3xl mb-2">🔭</div>
                            <h3 class="text-white font-bold">SNIPER</h3>
                            <p class="text-[10px] text-gray-500 mt-2 uppercase">Z for Scope</p>
                        </div>
                        <div onclick="setWeapon('smg')" id="w-smg" class="card-select bg-gray-900 p-6 rounded-2xl w-48 text-center">
                            <div class="text-3xl mb-2">⚡</div>
                            <h3 class="text-white font-bold">SMG</h3>
                            <p class="text-[10px] text-gray-500 mt-2 uppercase">Rapid Fire</p>
                        </div>
                        <div onclick="setWeapon('pistol')" id="w-pistol" class="card-select bg-gray-900 p-6 rounded-2xl w-48 text-center">
                            <div class="text-3xl mb-2">🎯</div>
                            <h3 class="text-white font-bold">PISTOL</h3>
                            <p class="text-[10px] text-gray-500 mt-2 uppercase">Tactical</p>
                        </div>
                    </div>
                </div>

                <!-- Right Section: Career Stats -->
                <div class="w-full lg:w-72 flex-shrink-0">
                    <h2 class="text-xl font-black text-white mb-4 uppercase italic border-b border-white/10 pb-2">Career Stats</h2>
                    <div id="stats-banner" class="bg-blue-600/10 border border-blue-500/30 p-6 rounded-2xl flex flex-col gap-6 h-full justify-center">
                        <div>
                            <div class="text-xs text-blue-400 font-bold uppercase mb-1">Total Points</div>
                            <div id="career-points" class="text-4xl font-black text-white leading-none">0</div>
                        </div>
                        <div class="border-t border-white/10 pt-4">
                            <div class="text-xs text-blue-400 font-bold uppercase mb-1">Best Streak</div>
                            <div id="career-streak" class="text-4xl font-black text-white leading-none">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Deploy Section -->
            <div class="mt-12">
                <h2 class="text-xl font-black text-white mb-4 uppercase italic border-b border-white/10 pb-2">Select Map & Deploy</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <button onclick="selectMap('cyber')" class="btn-deploy bg-blue-600/20 text-blue-400 px-8 py-6 rounded-xl border border-blue-600 font-bold uppercase tracking-widest text-lg">Cyber City</button>
                    <button onclick="selectMap('desert')" class="btn-deploy bg-yellow-600/20 text-yellow-400 px-8 py-6 rounded-xl border border-yellow-600 font-bold uppercase tracking-widest text-lg">Desert Outpost</button>
                    <button onclick="selectMap('forest')" class="btn-deploy bg-green-600/20 text-green-400 px-8 py-6 rounded-xl border border-green-600 font-bold uppercase tracking-widest text-lg">Forest Base</button>
                </div>
            </div>
        </div>
    </div>

    <div id="game-over">
        <h2 class="text-6xl font-black text-white mb-2 italic tracking-tighter">MATCH ENDED</h2>
        <div class="text-4xl font-bold text-blue-500 mb-2" id="final-score-display">0 - 0</div>
        <div class="text-xl font-bold text-gray-400 mb-8">Points Earned: <span id="match-points" class="text-green-400">+0</span></div>
        <button onclick="resetGame()" class="btn-primary">Return to Menu</button>
    </div>

    <div id="ui-overlay">
        <div class="flex justify-between items-start">
            <div class="bg-black/50 p-4 rounded-xl border-l-4 border-blue-500">
                <div class="text-xs text-blue-400 font-bold uppercase">Health</div>
                <div id="health-bar" class="w-48 h-4 bg-gray-800 rounded-full mt-1 overflow-hidden">
                    <div id="health-fill" class="h-full bg-blue-500 transition-all duration-300" style="width: 100%"></div>
                </div>
                <div id="health-text" class="text-xl font-black mt-1">150</div>
            </div>

            <div class="flex flex-col items-center">
                <div class="bg-black/50 p-4 rounded-xl text-center mb-2">
                    <div class="flex items-center gap-4">
                        <span id="player-score" class="text-4xl font-black text-blue-500">0</span>
                        <span class="text-2xl text-gray-600">-</span>
                        <span id="bot-score" class="text-4xl font-black text-red-500">0</span>
                    </div>
                </div>
                <div class="bg-blue-600/80 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">
                    Points: <span id="session-points">0</span>
                </div>
            </div>

            <div class="bg-black/50 p-4 rounded-xl border-r-4 border-yellow-500 text-right">
                <div id="weapon-name-ui" class="text-xs text-yellow-400 font-bold uppercase">AK-47</div>
                <div id="ammo-text" class="text-3xl font-black">30 / 30</div>
            </div>
        </div>
        <div id="kill-feed" class="absolute bottom-10 left-10 space-y-2"></div>
    </div>

    <div id="scope-overlay"><div class="vignette"></div></div>
    <div id="crosshair"></div>
    <div id="hit-marker">
        <div class="marker-line v t"></div><div class="marker-line v b"></div>
        <div class="marker-line h l"></div><div class="marker-line h r"></div>
    </div>

    <script>
        let scene, camera, renderer, clock;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isSpacePressed = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let raycaster, isGameRunning = false, isGameOver = false, currentMap = 'cyber';
        
        const MAX_HEALTH = 150;
        let health = MAX_HEALTH, playerScore = 0, botScore = 0;
        let currentPoints = 0, totalCareerPoints = 0, currentStreak = 0, maxCareerStreak = 0;
        
        let canShoot = true, isReloading = false;
        let isScoped = false;

        const POINT_VALUES = { BODY: 10, HEADSHOT: 50, ELIMINATION: 100, STREAK_BONUS: 150 };

        const WEAPONS = {
            ak: { name: 'AK-47', damage: 30, headshot: 100, rpm: 600, ammo: 30, recoil: 0.04, spread: 0.008, color: 0x5c3317, zoom: 75, auto: true },
            sniper: { name: 'Sniper', damage: 150, headshot: 200, rpm: 45, ammo: 5, recoil: 0.35, spread: 0.001, color: 0x222222, zoom: 75, scopedZoom: 10, auto: false },
            smg: { name: 'SMG', damage: 15, headshot: 45, rpm: 950, ammo: 45, recoil: 0.02, spread: 0.015, color: 0x444444, zoom: 80, auto: true },
            pistol: { name: 'Pistol', damage: 25, headshot: 75, rpm: 400, ammo: 12, recoil: 0.03, spread: 0.005, color: 0x333333, zoom: 85, auto: false }
        };
        let currentWeaponType = 'ak';
        let ammo = 30;

        let gunMesh, gunContainer, enemy, enemyHealth = 100, enemyLastShot = 0;

        function updateCareerDisplay() {
            const cp = document.getElementById('career-points');
            const cs = document.getElementById('career-streak');
            if(cp) cp.innerText = totalCareerPoints.toLocaleString();
            if(cs) cs.innerText = maxCareerStreak;
        }

        function addPoints(amount, label) {
            currentPoints += amount;
            totalCareerPoints += amount;
            
            const pop = document.createElement('div');
            pop.className = 'point-pop';
            pop.innerText = `+${amount} ${label || ''}`;
            pop.style.left = (window.innerWidth / 2 + (Math.random() * 100 - 50)) + 'px';
            pop.style.top = (window.innerHeight / 2 - 50) + 'px';
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 800);
            
            updateUI();
            updateCareerDisplay();
        }

        function setWeapon(type) {
            currentWeaponType = type;
            isScoped = false;
            document.querySelectorAll('.card-select').forEach(c => c.classList.remove('card-active'));
            const el = document.getElementById('w-' + type);
            if(el) el.classList.add('card-active');
            ammo = WEAPONS[type].ammo;
            if(isGameRunning) createWeaponModel();
            updateUI();
        }

        function selectMap(mapId) {
            currentMap = mapId;
            document.body.requestPointerLock();
        }

        function resetGame() {
            playerScore = 0; botScore = 0; health = MAX_HEALTH;
            currentPoints = 0; currentStreak = 0;
            isGameOver = false; isScoped = false;
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
            updateUI();
            updateCareerDisplay();
        }

        function triggerGameOver() {
            isGameOver = true; isGameRunning = false;
            document.exitPointerLock();
            document.getElementById('final-score-display').innerText = `${playerScore} - ${botScore}`;
            document.getElementById('match-points').innerText = `+${currentPoints}`;
            document.getElementById('game-over').style.display = 'flex';
            document.getElementById('ui-overlay').style.display = 'none';
            document.getElementById('crosshair').style.display = 'none';
            document.getElementById('scope-overlay').style.display = 'none';
        }

        function init() {
            scene = new THREE.Scene();
            clock = new THREE.Clock();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            raycaster = new THREE.Raycaster();

            document.addEventListener('keydown', e => { 
                if(!isGameRunning) return;
                handleKey(e.code, true); 
                if (e.code === 'Space') { isSpacePressed = true; shoot(); }
                if (e.code === 'KeyZ' && currentWeaponType === 'sniper') toggleScope();
            });

            document.addEventListener('keyup', e => {
                handleKey(e.code, false);
                if (e.code === 'Space') isSpacePressed = false;
            });

            document.addEventListener('mousedown', e => { 
                if(isGameRunning) {
                    if(e.button === 0) shoot();
                    if(e.button === 2 && currentWeaponType === 'sniper') toggleScope();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                if (isGameOver) return;
                isGameRunning = document.pointerLockElement === document.body;
                if (isGameRunning) setupMap(currentMap);
                document.getElementById('menu').style.display = isGameRunning ? 'none' : 'flex';
                document.getElementById('ui-overlay').style.display = isGameRunning ? 'block' : 'none';
                updateUI();
            });

            document.addEventListener('mousemove', (e) => {
                if (isGameRunning) {
                    let sensitivity = isScoped ? 0.0004 : 0.002;
                    camera.rotation.y -= e.movementX * sensitivity;
                    camera.rotation.x -= e.movementY * sensitivity;
                    camera.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, camera.rotation.x));
                }
            });
            animate();
            updateCareerDisplay();
        }

        function toggleScope() {
            isScoped = !isScoped;
            updateUI();
        }

        function handleKey(code, isDown) {
            switch(code) {
                case 'KeyW': moveForward = isDown; break;
                case 'KeyS': moveBackward = isDown; break;
                case 'KeyA': moveLeft = isDown; break;
                case 'KeyD': moveRight = isDown; break;
                case 'KeyR': if(isDown) reload(); break;
            }
        }

        function setupMap(mapId) {
            while(scene.children.length > 0) scene.remove(scene.children[0]);
            scene.add(new THREE.HemisphereLight(0xeeeeff, 0x777788, 1.2));
            const sun = new THREE.DirectionalLight(0xffffff, 1.0);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            let config = { cyber: [0x111111, 0x00ffff], desert: [0xd2b48c, 0xffe4b5], forest: [0x228b22, 0x87ceeb] }[mapId];
            scene.background = new THREE.Color(config[1]);
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshPhongMaterial({ color: config[0] }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            gunContainer = new THREE.Group();
            scene.add(gunContainer);
            createWeaponModel();
            
            camera.position.set(0, 1.7, 0);
            updateUI();
            spawnEnemy(true);
        }

        function createWeaponModel() {
            if(gunMesh) gunContainer.remove(gunMesh);
            const w = WEAPONS[currentWeaponType];
            gunMesh = new THREE.Group();
            
            let bodySize = [0.1, 0.2, 0.6];
            let barrelSize = [0.02, 0.5];
            
            if (currentWeaponType === 'pistol') bodySize = [0.06, 0.15, 0.3];
            if (currentWeaponType === 'sniper') { bodySize = [0.12, 0.2, 0.9]; barrelSize = [0.03, 1.0]; }

            const body = new THREE.Mesh(new THREE.BoxGeometry(...bodySize), new THREE.MeshStandardMaterial({ color: w.color }));
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(barrelSize[0], barrelSize[0], barrelSize[1]), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            barrel.rotation.x = Math.PI/2; barrel.position.z = -(bodySize[2]/2 + barrelSize[1]/2);
            
            gunMesh.add(body, barrel);
            gunMesh.position.set(0.4, -0.35, -0.7);
            gunContainer.add(gunMesh);
        }

        function spawnEnemy(forced) {
            if (enemy) scene.remove(enemy);
            const group = new THREE.Group();
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({ color: 0xffdbac }));
            head.position.y = 2.15; head.userData.isHead = true;
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), new THREE.MeshPhongMaterial({ color: 0x3366ff }));
            body.position.y = 1.4;
            group.add(head, body);
            
            group.position.set(forced ? 0 : (Math.random()-0.5)*60, 0, forced ? -25 : -30 - Math.random()*20);
            enemy = group; enemyHealth = 100;
            scene.add(enemy);
        }

        function shoot() {
            const w = WEAPONS[currentWeaponType];
            if (!canShoot || isReloading || ammo <= 0) return;
            canShoot = false; ammo--; updateUI();
            
            camera.rotation.x += isScoped ? w.recoil * 0.5 : w.recoil;
            if (gunMesh.visible) gunMesh.position.z += 0.2;

            raycaster.setFromCamera({ x: (Math.random() - 0.5) * w.spread, y: (Math.random() - 0.5) * w.spread }, camera);
            const hits = raycaster.intersectObjects(enemy.children, true);
            if (hits.length > 0) {
                const hitObj = hits[0].object;
                const dmg = hitObj.userData.isHead ? w.headshot : w.damage;
                enemyHealth -= dmg;
                showHitMarker();
                addPoints(hitObj.userData.isHead ? POINT_VALUES.HEADSHOT : POINT_VALUES.BODY, hitObj.userData.isHead ? "HEADSHOT" : "");
                
                if (enemyHealth <= 0) {
                    playerScore++; currentStreak++;
                    maxCareerStreak = Math.max(maxCareerStreak, currentStreak);
                    addPoints(POINT_VALUES.ELIMINATION, "ELIMINATION");
                    addToKillFeed(hitObj.userData.isHead ? "🎯 HEADSHOT ELIMINATION" : "⚔️ ELIMINATED");
                    if (playerScore >= 15) triggerGameOver(); else spawnEnemy();
                }
            }

            setTimeout(() => {
                canShoot = true;
                if (isSpacePressed && w.auto && isGameRunning) shoot();
            }, 60000 / w.rpm);
        }

        function reload() {
            if (isReloading || ammo === WEAPONS[currentWeaponType].ammo) return;
            isReloading = true; isScoped = false; updateUI();
            document.getElementById('ammo-text').innerText = "RELOADING...";
            setTimeout(() => {
                ammo = WEAPONS[currentWeaponType].ammo; isReloading = false;
                updateUI();
            }, 1800);
        }

        function updateUI() {
            if (!isGameRunning) return;
            document.getElementById('health-fill').style.width = (health / MAX_HEALTH) * 100 + '%';
            document.getElementById('health-text').innerText = Math.max(0, Math.round(health));
            document.getElementById('ammo-text').innerText = isReloading ? "RELOADING..." : `${ammo} / ${WEAPONS[currentWeaponType].ammo}`;
            document.getElementById('player-score').innerText = playerScore;
            document.getElementById('bot-score').innerText = botScore;
            document.getElementById('session-points').innerText = currentPoints;
            document.getElementById('weapon-name-ui').innerText = WEAPONS[currentWeaponType].name;
            
            document.getElementById('scope-overlay').style.display = isScoped ? 'block' : 'none';
            document.getElementById('crosshair').style.display = !isScoped ? 'block' : 'none';
            camera.fov = isScoped ? WEAPONS[currentWeaponType].scopedZoom : WEAPONS[currentWeaponType].zoom;
            camera.updateProjectionMatrix();
            if (gunMesh) gunMesh.visible = !isScoped;
        }

        function showHitMarker() {
            const m = document.getElementById('hit-marker');
            m.style.display = 'block'; setTimeout(() => m.style.display = 'none', 100);
        }

        function addToKillFeed(msg) {
            const f = document.getElementById('kill-feed');
            const i = document.createElement('div');
            i.className = 'bg-black/80 px-4 py-1 rounded italic font-black text-xs border-l-4 border-blue-500 text-white';
            i.innerText = msg; f.appendChild(i); setTimeout(() => i.remove(), 3000);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isGameRunning) { renderer.render(scene, camera); return; }

            const delta = clock.getDelta();
            velocity.x -= velocity.x * 10 * delta;
            velocity.z -= velocity.z * 10 * delta;
            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            const speed = (isScoped || currentWeaponType === 'sniper') ? 8 : 15;
            if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            
            if (gunContainer) {
                gunContainer.position.copy(camera.position);
                gunContainer.rotation.copy(camera.rotation);
                gunMesh.position.z = THREE.MathUtils.lerp(gunMesh.position.z, -0.7, 0.1);
            }

            if (enemy && !isGameOver) {
                enemy.lookAt(camera.position.x, enemy.position.y, camera.position.z);
                if (Date.now() - enemyLastShot > 2000) {
                    enemyLastShot = Date.now();
                    if (Math.random() > 0.8) {
                        health -= 20; updateUI();
                        if(health <= 0) { 
                            botScore++; health = MAX_HEALTH; 
                            camera.position.set(0,1.7,0);
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        }

        init();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
